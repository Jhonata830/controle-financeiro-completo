services:
  financeiro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controle-financeiro-mercado-pago
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      DATA_DIR: /app/dados
      BACKUP_DIR: /app/backups
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./dados:/app/dados
      - ./backups:/app/backups
    ports:
      - "5051:8000"
